name: Bug report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "请移除 API Key、安全令牌和私人资料。"
  - type: input
    id: version
    attributes: {label: Velaryn 版本, placeholder: "v0.9.0-beta"}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: 设备与 Android 版本, placeholder: "Xiaomi Pad / Android 15"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤, description: 请按顺序列出操作}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 预期结果}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: 实际结果与脱敏截图}
    validations: {required: true}
