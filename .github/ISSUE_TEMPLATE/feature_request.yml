name: Feature request
description: 描述希望完成的真实任务
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: task
    attributes: {label: 你希望完成什么任务？, description: 请描述使用场景，而不只是功能名称}
    validations: {required: true}
  - type: textarea
    id: blocker
    attributes: {label: 当前阻碍或替代方案}
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: 理想结果}
    validations: {required: true}
